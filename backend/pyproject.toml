[project]
name = "tintinhr-api"
version = "1.0.0"
description = "Authorization-aware agentic HR assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "pgvector>=0.3,<1",
  "python-jose[cryptography]>=3.3,<4",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.9,<1",
  "redis>=5,<6",
  "celery[redis]>=5.4,<6",
  "langchain-core>=0.3,<1",
  "langgraph>=0.2,<1",
  "langchain-openai>=0.2,<1",
  "langchain-google-genai>=2,<3",
  "sentence-transformers>=3,<4",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "httpx>=0.27,<1",
  "orjson>=3.10,<4",
  "structlog>=24,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "ragas>=0.2,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
